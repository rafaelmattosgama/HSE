# Local demo stack (npm run demo). Separate project, volumes and ports from the
# development stack (docker-compose.yml), so demo data never mixes with it.
name: ma-hse-demo
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: ehs
      POSTGRES_PASSWORD: ehs
      POSTGRES_DB: ehs_demo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    ports: ["127.0.0.1:5434:5432"]
    volumes: [demo_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehs -d ehs_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.2-alpine
    ports: ["127.0.0.1:6381:6379"]
    volumes: [demo_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes: [demo_minio:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minio minio123 &&
      mc mb -p local/ehs-demo-attachments && mc anonymous set none local/ehs-demo-attachments"
volumes:
  demo_postgres:
  demo_redis:
  demo_minio:
