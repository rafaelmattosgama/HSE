<!doctype html>
<html lang="pt-PT">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <main style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:24px;">
      <h1 style="margin:0 0 16px;font-size:22px;color:#061a52;">Credenciais de acesso</h1>
      <p>Ola {{user_name}},</p>
      <p>A sua conta MA HSE esta pronta.</p>
      <p><strong>Email:</strong> {{user_email}}</p>
      <p><strong>Palavra-passe temporaria:</strong> {{temporary_password}}</p>
      <p>
        Aceda em
        <a href="{{login_url}}" style="color:#0a4dff;">{{login_url}}</a>
        e altere a palavra-passe no primeiro acesso.
      </p>
      <p>Se nao esperava este acesso, contacte o administrador HSE.</p>
    </main>
  </body>
</html>
