<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <main style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:24px;">
      <h1 style="margin:0 0 16px;font-size:22px;color:#061a52;">S-EWO alert</h1>
      <p>Hello {{recipient_name}},</p>
      <p>A S-EWO alert requires attention.</p>
      <p><strong>Alert type:</strong> {{tipo_alerta}}</p>
      <p><strong>Description:</strong> {{descricao}}</p>
      <p><strong>Priority:</strong> {{prioridade}}</p>
      <p><strong>Date/time:</strong> {{data_hora}}</p>
      <p><strong>Code:</strong> {{sewo_code}}</p>
      <p><strong>Plant:</strong> {{plant_name}}</p>
      <p><strong>Status:</strong> {{sewo_status}}</p>
      <p>
        Open the record:
        <a href="{{sewo_url}}" style="color:#0a4dff;">{{sewo_url}}</a>
      </p>
    </main>
  </body>
</html>
