<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <main style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:24px;">
      <h1 style="margin:0 0 16px;font-size:22px;color:#061a52;">New access password</h1>
      <p>Hello {{user_name}},</p>
      <p>A new temporary password was generated for your MA HSE account.</p>
      <p><strong>Email:</strong> {{user_email}}</p>
      <p><strong>Temporary password:</strong> {{temporary_password}}</p>
      <p>Sign in at <a href="{{login_url}}" style="color:#0a4dff;">{{login_url}}</a> and change your password.</p>
    </main>
  </body>
</html>
