<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <main style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:24px;">
      <h1 style="margin:0 0 16px;font-size:22px;color:#061a52;">Credenciales de acceso</h1>
      <p>Hola {{user_name}},</p>
      <p>Su cuenta MA HSE esta lista.</p>
      <p><strong>Email:</strong> {{user_email}}</p>
      <p><strong>Contrasena temporal:</strong> {{temporary_password}}</p>
      <p>
        Acceda en
        <a href="{{login_url}}" style="color:#0a4dff;">{{login_url}}</a>
        y cambie la contrasena en el primer acceso.
      </p>
      <p>Si no esperaba este acceso, contacte con su administrador HSE.</p>
    </main>
  </body>
</html>
