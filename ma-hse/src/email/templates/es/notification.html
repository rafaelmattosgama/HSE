<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <main style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:24px;">
      <h1 style="margin:0 0 16px;font-size:22px;color:#061a52;">{{titulo_notificacao}}</h1>
      <p>Hola {{recipient_name}},</p>
      <p>{{mensagem}}</p>
      <p><strong>Fecha/hora:</strong> {{data_hora}}</p>
      <p><strong>Planta:</strong> {{plant_name}}</p>
      <p>
        Ver detalles:
        <a href="{{action_url}}" style="color:#0a4dff;">{{action_url}}</a>
      </p>
    </main>
  </body>
</html>
