<!doctype html>
<html lang="it">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <main style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:24px;">
      <h1 style="margin:0 0 16px;font-size:22px;color:#061a52;">Nuova password di accesso</h1>
      <p>Ciao {{user_name}},</p>
      <p>E stata generata una nuova password temporanea per il tuo account MA HSE.</p>
      <p><strong>Email:</strong> {{user_email}}</p>
      <p><strong>Password temporanea:</strong> {{temporary_password}}</p>
      <p>Accedi da <a href="{{login_url}}" style="color:#0a4dff;">{{login_url}}</a> e modifica la password.</p>
    </main>
  </body>
</html>
