services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ehs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-ehs}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ehs} -d ${POSTGRES_DB:-ehs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    restart: "no"
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}\" \"${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.production}\" &&
      (mc mb -p local/\"${S3_BUCKET:-ehs-attachments}\" || true) &&
      mc anonymous set none local/\"${S3_BUCKET:-ehs-attachments}\"
      "

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    ports:
      - "${APP_PORT:-3004}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["npm", "run", "start", "--", "-p", "3000", "-H", "0.0.0.0"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["npm", "run", "worker"]

  migrate:
    build:
      context: .
      target: runner
    restart: "no"
    profiles: ["tasks"]
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-lc", "npm run db:migrate:deploy && npm run db:repair:encoding -- --apply"]

  scheduler:
    build:
      context: .
      target: runner
    restart: "no"
    profiles: ["tasks"]
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "scheduler"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
